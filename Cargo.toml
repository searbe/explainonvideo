[package]
name = "explainonvideo"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "A small screen recorder for SteamOS: area or windows, sound, microphone, camera; trim and share the MP4."
license = "MIT"

[dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
gio = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
pango = "0.18"
pangocairo = "0.18"
gdk-pixbuf = "0.18"
gstreamer = "0.21"
gstreamer-app = "0.21"
serde_json = "1"
wayland-client = "0.31"
wayland-scanner = "0.31"

[profile.release]
opt-level = 2
strip = true
lto = "thin"
